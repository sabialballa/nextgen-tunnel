name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile
        run: python3 -m py_compile model.py agent.py tunnelctl.py runtime/receive-buffer.py runtime/soak.py
      - name: Offline safety and rendering tests
        run: python3 -m unittest discover -s tests -v
